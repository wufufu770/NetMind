<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" font-family="Inter,Segoe UI,Arial,sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#64748b"/></marker>
  </defs>
  <style>
    .box{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5;rx:10}
    .core{fill:#eff6ff;stroke:#3b82f6}
    .gate{fill:#fef2f2;stroke:#ef4444}
    .t{font-size:14px;fill:#0f172a}
    .s{font-size:11px;fill:#64748b}
    .lbl{font-size:11px;fill:#475569}
    .l{stroke:#64748b;stroke-width:1.5;fill:none;marker-end:url(#a)}
  </style>

  <rect class="box" x="20" y="30" width="180" height="60"/>
  <text class="t" x="110" y="55" text-anchor="middle">CLI / API / MCP</text>
  <text class="s" x="110" y="73" text-anchor="middle">thin adapters</text>

  <rect class="box core" x="280" y="20" width="300" height="80"/>
  <text class="t" x="430" y="45" text-anchor="middle">Closed Loop Orchestrator</text>
  <text class="s" x="430" y="64" text-anchor="middle">Intent → Plan → Verify → Deploy</text>
  <text class="s" x="430" y="80" text-anchor="middle">→ Observe → Compare → Heal</text>

  <rect class="box core" x="650" y="20" width="210" height="80"/>
  <text class="t" x="755" y="45" text-anchor="middle">Rule Engine</text>
  <text class="s" x="755" y="64" text-anchor="middle">deterministic fallback</text>
  <text class="s" x="755" y="80" text-anchor="middle">(LLM-optional)</text>

  <rect class="box gate" x="280" y="150" width="300" height="70"/>
  <text class="t" x="430" y="175" text-anchor="middle">SecurityChecker + Approvals</text>
  <text class="s" x="430" y="194" text-anchor="middle">allowlist · deny-keywords · human gate</text>

  <rect class="box" x="280" y="270" width="300" height="60"/>
  <text class="t" x="430" y="295" text-anchor="middle">Transaction Manager</text>
  <text class="s" x="430" y="313" text-anchor="middle">mode: simulated | dry-run | real</text>

  <rect class="box" x="650" y="150" width="210" height="70"/>
  <text class="t" x="755" y="175" text-anchor="middle">Verifier</text>
  <text class="s" x="755" y="194" text-anchor="middle">semantic conflicts · SLA path check</text>

  <rect class="box" x="40" y="150" width="160" height="70"/>
  <text class="t" x="120" y="175" text-anchor="middle">PersistentStore</text>
  <text class="s" x="120" y="194" text-anchor="middle">single source of truth</text>

  <rect class="box" x="650" y="270" width="210" height="90"/>
  <text class="t" x="755" y="295" text-anchor="middle">Drivers</text>
  <text class="s" x="755" y="314" text-anchor="middle">simulation (default)</text>
  <text class="s" x="755" y="330" text-anchor="middle">ssh/netconf — dry-run gated,</text>
  <text class="s" x="755" y="346" text-anchor="middle">collect() read-only</text>

  <line class="l" x1="200" y1="60" x2="278" y2="55"/>
  <line class="l" x1="580" y1="55" x2="648" y2="55"/>
  <line class="l" x1="430" y1="100" x2="430" y2="148"/>
  <line class="l" x1="548" y1="185" x2="648" y2="185"/>
  <line class="l" x1="430" y1="220" x2="430" y2="268"/>
  <line class="l" x1="200" y1="185" x2="278" y2="185"/>
  <line class="l" x1="580" y1="315" x2="648" y2="315"/>

  <text class="lbl" x="240" y="140">every write</text>
  <text class="lbl" x="600" y="305">gated execute()</text>
</svg>
