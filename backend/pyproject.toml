[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netmind"
dynamic = ["version"]
description = "Intent-driven network operations agent: natural-language intent to verified, rollback-safe policy changes."
license = { text = "MIT" }
authors = [{ name = "wufufu770" }]
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: System :: Networking",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.32.1",
  "pydantic==2.10.3",
  "python-dotenv==1.0.1",
  "typer==0.15.1",
  "click>=8.1,<8.2",
  "rich==13.9.4",
  "httpx==0.28.1",
  "PyYAML==6.0.2",
]

[project.optional-dependencies]
drivers = [
  "napalm>=4.1,<6",
  "netmiko>=4.3,<5",
  "ncclient>=0.6.13,<1",
  "paramiko>=3.4,<4",
]
langgraph = ["langgraph>=0.2.0"]
dev = ["pytest==8.3.4", "pytest-asyncio==0.24.0"]

[project.scripts]
netmind = "app.cli:run"

[tool.setuptools.dynamic]
version = { attr = "app.__version__" }

[tool.setuptools.packages.find]
include = ["app*"]
