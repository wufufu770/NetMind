services:
  backend:
    build: ./backend
    ports: ['8000:8000']
    environment:
      - NETMIND_DRIVER=simulation
      - NETMIND_ENABLE_REAL_COMMANDS=false
      - NETMIND_DATA_FILE=/app/data/netmind_store.json
      # ⚠️ 用 compose 起时，这个变量**必须**设，否则面板全挂。
      #
      # 原因：后端的「只许本机」判的是对端地址是不是 127.0.0.1。而经
      # docker 端口映射进来的请求，对端看到的是**网关 IP**（172.x.x.1），
      # 不是 loopback——哪怕请求是你在自己电脑上用浏览器发的。
      # 于是默认（token 留空）下 /api/* 一律 403，面板能打开但一个数据都拿不到。
      #
      # ⚠️ **必须**设 NETMIND_ADMIN_TOKEN，否则面板能打开但一个数据都拿不到。
      # 起法：NETMIND_ADMIN_TOKEN=$(python3 -c "import secrets;print(secrets.token_urlsafe(32))") docker compose up -d
      # 之后在浏览器控制台执行 localStorage.setItem('netmind-admin-token', '<同一个值>')。
      # 直接跑 uvicorn（不经容器）时不需要——那时确实来自 loopback。
      - NETMIND_ADMIN_TOKEN=${NETMIND_ADMIN_TOKEN:-}
    volumes:
      - netmind-data:/app/data
    healthcheck:
      # 用 /healthz 而不是 /api/*：前者是唯一的免认证口，探针不配凭据也能用
      test: ['CMD', 'python', '-c',
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
  # 面板：nginx 托管**生产构建**，并把 /api 与 /ws 同源反代到 backend。
  # 因此容器里不再需要设 VITE_API_URL——那是构建期变量，容器里设对已构建页面无效。
  # API 基址在启动时注入，默认空串 = 同源。想让面板直连别处：
  # 传 NETMIND_API_BASE=https://... 即可。
  frontend:
    build: ./frontend
    ports: ['5173:80']
    environment:
      - NETMIND_API_BASE=${NETMIND_API_BASE:-}
    depends_on:
      backend:
        condition: service_healthy
volumes:
  netmind-data:
