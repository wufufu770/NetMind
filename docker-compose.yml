services:
  backend:
    build: ./backend
    ports: ['8000:8000']
    environment:
      - NETMIND_DRIVER=simulation
      - NETMIND_ENABLE_REAL_COMMANDS=false
      - NETMIND_DATA_FILE=/app/data/netmind_store.json
      # 留空 = 仅本机可访问（远程一律 403）。这是安全的默认值。
      # 任何非本机访问都必须设 NETMIND_ADMIN_TOKEN，否则连 localhost 之外的
      # 任何接口都拿不到。见 docs/DEPLOY.md 第 1 节。
      - NETMIND_ADMIN_TOKEN=${NETMIND_ADMIN_TOKEN:-}
    volumes:
      - netmind-data:/app/data
  # 面板。Vite dev server，不是生产静态服务——生产部署请自行接静态托管 + 反代。
  frontend:
    build: ./frontend
    ports: ['5173:5173']
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on: [backend]
volumes:
  netmind-data:
