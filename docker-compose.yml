services:
  backend:
    build: ./backend
    ports: ['8000:8000']
    environment:
      - NETMIND_DRIVER=simulation
      - NETMIND_ENABLE_REAL_COMMANDS=false
      - NETMIND_DATA_FILE=/app/data/netmind_store.json
    volumes:
      - netmind-data:/app/data
  frontend:
    build: ./frontend
    ports: ['5173:5173']
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on: [backend]
  redis:
    image: redis:7-alpine
    profiles: ['prod']
  postgres:
    image: postgres:16-alpine
    profiles: ['prod']
    environment:
      POSTGRES_DB: netmind
      POSTGRES_USER: netmind
      POSTGRES_PASSWORD: netmind
volumes:
  netmind-data:
