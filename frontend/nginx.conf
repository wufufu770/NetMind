# 生产静态托管 + 同源反代。
#
# 为什么自己反代 /api 而不是让前端填绝对地址：
#   · 同源就没有 CORS，也就没有预检。跨源发 Authorization 头会触发预检，
#     预检失败的表现常常像「网络问题」，很难查
#   · 同一份镜像换部署地址不用重新构建——地址在启动时注入，不是构建时烤死

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 运行时注入 API 基址。留空 = 同源（由本 nginx 反代到后端）。
    # 想让前端直连别处时，把 NETMIND_API_BASE 传进容器即可。
    location = /index.html {
        add_header Cache-Control "no-store";
        sub_filter_once on;
        sub_filter '<!--NETMIND_API_BASE-->' '${NETMIND_API_BASE}';
    }

    # SPA 路由：任何未命中的路径都回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带指纹的静态资源可以长缓存；index.html 由上面 no-store 单独处理
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # XFF 不可信：后端默认不采信，需显式 NETMIND_TRUST_PROXY=true 才读
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    location /ws {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;   # 事件流是长连接，别让默认 60s 掐了
    }

    # 前端容器自己的探活，不经过后端
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
