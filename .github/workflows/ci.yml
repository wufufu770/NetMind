name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Run tests
        run: pytest -q
        working-directory: backend
      - name: Validate project
        run: python scripts/validate_project.py
        working-directory: .

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test frontend
        run: npm ci --no-audit --no-fund && npm test
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend

  loop-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Loop gates (含去 AI 味密度门与死模块门)
        run: python scripts/loop.py gates

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: pip-audit
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r backend/requirements.txt
      - name: npm audit
        run: npm audit --audit-level=high
        working-directory: frontend
      - name: SBOM
        run: |
          pip install cyclonedx-bom
          cyclonedx-py environment --outfile netmind-sbom.json -o frontend -t python
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: netmind-sbom.json
